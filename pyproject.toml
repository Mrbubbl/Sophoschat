[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aichat"
version = "0.1.0"
description = "SophosChat — 自部署的私人聊天软件，外部 Agent 维护按会话隔离的主题记忆"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "playwright"]

[project.scripts]
aichat = "aichat.cli:main"
aichat-bridge = "aichat_bridge.cli:main"

[tool.setuptools]
packages = ["aichat", "aichat_bridge"]

[tool.setuptools.package-data]
aichat = ["static/*", "AGENT_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
