name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [app, main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04  # 自带 Android SDK（platforms 34+、build-tools），不用再装
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Restore release key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Rename + version.json
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk SophosChat.apk
          git log -1 --pretty=%s | head -c 300 > notes.txt
          python3 -c "import json;print(json.dumps({'versionCode':${{ github.run_number }},'versionName':'1.${{ github.run_number }}','notes':open('notes.txt').read()}))" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: SophosChat-apk
          path: |
            SophosChat.apk
            version.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: SophosChat Android ${{ github.run_number }}
          files: |
            SophosChat.apk
            version.json
